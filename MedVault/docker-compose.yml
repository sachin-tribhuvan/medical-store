name: medvault

services:
  mongodb:
    image: mongo:7
    container_name: medvault-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # only for Mode 1 (local Node/React); safe to remove for Mode 2
    volumes:
      - medvault-mongodb-data:/data/db
    networks: [medvault-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: medvault-backend:latest
    container_name: medvault-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/medvault
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      AUTO_SEED: "true"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [medvault-net]

  frontend:
    build: ./frontend
    image: medvault-frontend:latest
    container_name: medvault-frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-/api}
      BACKEND_UPSTREAM: backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on: [backend]
    networks: [medvault-net]

networks:
  medvault-net:
    name: medvault-net

volumes:
  medvault-mongodb-data:
    name: medvault-mongodb-data
