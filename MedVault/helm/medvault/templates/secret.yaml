apiVersion: v1
kind: Secret
metadata:
  name: medvault-secret
  namespace: {{ include "medvault.namespace" . }}
  labels:
    {{- include "medvault.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.username | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@mongodb-service:%v/%s?authSource=admin" .Values.mongodb.auth.username (.Values.mongodb.auth.password | urlquery) .Values.mongodb.port .Values.mongodb.database | quote }}
