apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: {{ include "medvault.namespace" . }}
  labels:
    {{- include "medvault.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}
