apiVersion: v1
kind: ConfigMap
metadata:
  name: medvault-config
  namespace: medvault
data:
  NODE_ENV: "production"
  PORT: "5000"
  CORS_ORIGIN: "*"                      # browsers use the same-origin /api proxy; tighten if you expose the API directly
  AUTO_SEED: "true"
  API_URL: "/api"                       # browser-visible API URL (runtime config)
  BACKEND_UPSTREAM: "backend-service:5000"
