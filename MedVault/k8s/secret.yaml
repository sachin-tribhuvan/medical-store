# DEV PLACEHOLDERS ONLY - override before any shared/real deployment (see README).
apiVersion: v1
kind: Secret
metadata:
  name: medvault-secret
  namespace: medvault
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: medvault
  MONGO_INITDB_ROOT_PASSWORD: change-me-dev-only
  MONGO_URI: mongodb://medvault:change-me-dev-only@mongodb-service:27017/medvault?authSource=admin
