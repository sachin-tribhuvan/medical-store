# Rendered by the nginx image's envsubst step (only ${BACKEND_UPSTREAM} is substituted).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /config.js { add_header Cache-Control "no-store"; }

  # Same-origin API proxy so the browser never needs an internal service address.
  location /api/ {
    proxy_pass http://${BACKEND_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }  # React Router support
}
